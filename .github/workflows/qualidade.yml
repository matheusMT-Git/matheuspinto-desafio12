# Marco 6: CI do GOVSAFE 360 — sintaxe, testes de unidade/MCP e E2E (Playwright).
# Não usa segredos nem tokens. Permissão mínima: somente leitura do repositório.
name: Qualidade

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências de teste (lockfile)
        run: npm ci

      - name: Verificar sintaxe JavaScript
        run: npm run check:js

      - name: Testes de política, exportação e MCP
        run: npm test

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (desktop e mobile)
        run: npm run test:e2e

      - name: Publicar relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            evidencias/relatorio-html/
            evidencias/playwright-resultados/
          retention-days: 7
