[project]
name = "escalas-atendimento"
version = "0.1.0"
description = "Sistema de escalas de atendimento (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "jinja2",
    "python-multipart",
    "pydantic>=2",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() em argumentos é o idioma do FastAPI

[tool.setuptools.packages.find]
include = ["app*"]
