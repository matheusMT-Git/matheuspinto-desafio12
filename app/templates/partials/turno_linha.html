<div class="turno-linha grid">
  <input type="date" name="turno_data" aria-label="Data do turno" required>
  <input type="time" name="turno_inicio" aria-label="Hora inicial" required>
  <input type="time" name="turno_fim" aria-label="Hora final" required>
  <select name="turno_tipo" aria-label="Tipo do turno">
    {% for tipo in tipos_turno %}<option>{{ tipo }}</option>{% endfor %}
  </select>
  <input type="number" name="turno_vagas" value="1" min="1" aria-label="Vagas" required>
  <button type="button" class="outline secondary"
          onclick="this.closest('.turno-linha').remove()">Remover</button>
</div>
